name: Habibi growth research

on:
  workflow_dispatch:
  push:
    branches: [growth-engine]
    paths:
      - "habibi/growth_research.py"
      - ".github/workflows/habibi-growth-research.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: habibi/requirements.txt
      - run: pip install -r habibi/requirements.txt
      - run: python -m habibi.growth_research
      - name: Save results
        run: |
          git config user.name "habibi-bot"
          git config user.email "habibi-bot@users.noreply.github.com"
          git add habibi/output/growth_research.json
          git diff --cached --quiet && exit 0
          git commit -m "Habibi growth research results"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
